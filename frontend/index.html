<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Giao thông thông minh - MQTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-4 md:p-8 min-h-screen">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-4 text-center md:text-left">
            <h1 class="text-3xl md:text-4xl font-bold text-emerald-400">🚥 BẢNG ĐIỀU KHIỂN GIAO THÔNG AI</h1>
            <p class="text-slate-400 mt-2">Đồng bộ thời gian thực qua giao thức MQTT & REST API</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-600 flex flex-col">
                <h2 class="text-xl font-bold mb-4 text-sky-400">👁️ Dữ liệu Camera AI</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="bg-slate-950 p-4 rounded-lg text-center border border-blue-900/50">
                        <p class="text-xs md:text-sm text-slate-400 uppercase">Trục Bắc - Nam</p>
                        <p class="text-4xl md:text-5xl font-black text-blue-400 mt-2" id="count-bn">0</p>
                        <p class="text-xs text-slate-500 mt-1">xe đang chờ</p>
                    </div>
                    <div class="bg-slate-950 p-4 rounded-lg text-center border border-green-900/50">
                        <p class="text-xs md:text-sm text-slate-400 uppercase">Trục Đông - Tây</p>
                        <p class="text-4xl md:text-5xl font-black text-green-400 mt-2" id="count-dt">0</p>
                        <p class="text-xs text-slate-500 mt-1">xe đang chờ</p>
                    </div>
                </div>

                <div class="bg-slate-700 p-4 rounded-lg flex-grow flex flex-col justify-center">
                    <p class="text-sm text-slate-300">Quyết định của AI điều phối:</p>
                    <p class="text-lg md:text-xl font-bold text-amber-400 mt-1" id="ai-decision">Đang chờ dữ liệu...</p>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-600 flex flex-col">
                <h2 class="text-xl font-bold mb-4 text-emerald-400">⚙️ Trạng thái Mạch ESP32</h2>
                
                <div class="bg-slate-950 p-4 rounded-lg flex-grow flex flex-col justify-center">
                    <p class="text-sm text-slate-400 uppercase mb-2">Phản hồi từ Wokwi (MQTT Topic)</p>
                    <div class="p-4 bg-slate-900 rounded border border-slate-700 min-h-[80px] flex items-center">
                        <code class="text-emerald-300 text-lg font-mono" id="hw-status">Đang kết nối...</code>
                    </div>
                </div>

                <button onclick="triggerEmergency()" class="mt-6 w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 px-4 rounded-lg transition-colors shadow-lg shadow-red-900/50 flex items-center justify-center gap-2 text-lg">
                    <span>🚨</span> Kích hoạt Khẩn cấp (Xe cứu thương)
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api/dashboard";
        const EMERGENCY_URL = "http://127.0.0.1:5000/api/emergency";

        async function fetchDashboard() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                document.getElementById('count-bn').innerText = data.count_BN;
                document.getElementById('count-dt').innerText = data.count_DT;
                document.getElementById('ai-decision').innerText = data.ai_decision;
                document.getElementById('hw-status').innerText = data.hardware_status;
            } catch (err) {
                console.error("Lỗi mất kết nối Server:", err);
            }
        }

        async function triggerEmergency() {
            try {
                await fetch(EMERGENCY_URL, { method: 'POST' });
                alert("Đã gửi lệnh ưu tiên khẩn cấp xuống mạch ESP32!");
            } catch (err) {
                alert("Lỗi: Không thể gửi lệnh.");
            }
        }

        setInterval(fetchDashboard, 1000);
        fetchDashboard();
    </script>
</body>
</html>
